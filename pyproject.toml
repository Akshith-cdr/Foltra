[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "foltra"
version = "0.1.0"
description = "FOLTRA crop health research and dataset preparation"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

# Root-relative configuration and manifests require an editable source checkout.
